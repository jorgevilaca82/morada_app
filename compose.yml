services:
  web:
    build:
      context: .
    env_file:
      - .env
    stdin_open: true
    tty: true
    image: morada-web-app:latest
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - ENV=development
    depends_on:
      - db

  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: morada_db
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data: